
services:

  moderation-service:
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    image: comments-platform/moderation-service:1.0.0
    ports:
      - "8081:8081"
    restart: unless-stopped

  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    image: comments-platform/comment-service:1.0.0
    ports:
      - "8080:8080"
    environment:
      MODERATION_SERVICE_BASE_URL: http://moderation-service:8081
    depends_on:
      - moderation-service
    restart: unless-stopped
