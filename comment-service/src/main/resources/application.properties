# Application
spring.application.name=comment-service
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:commentsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.rochacamargovitor=INFO
logging.level.org.hibernate.SQL=DEBUG

# Moderation Service
moderation.service.base-url=http://localhost:8081
